[package]
name = "assignment"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "assignment"

[dependencies]
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
log4rs = "1.3.0"
log = "0.4.22"
structopt = "0.3.26"
crossbeam-channel = "0.5.14"
async-trait = "0.1.83"
reqwest = "0.12.12"
actix-web = "4.8.0"
actix-web-prometheus = "0.1.2"
tokio = { version = "1.42.0", features = ["rt", "rt-multi-thread", "macros"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
strum_macros = "0.26.4"
ta = "0.5.0"
signal-hook = "0.3.17"
etcd-client = "0.14.0"
futures-util = "0.3.31"